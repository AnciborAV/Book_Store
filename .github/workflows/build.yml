name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-test" playwright@1.58.2
          "$RUNNER_TEMP/browser-test/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser and persistent database restart
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-test/node_modules/playwright
        run: node scripts/browser-smoke.cjs
      - name: Java PDF library and persistent files
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-test/node_modules/playwright
        run: node scripts/java-library-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: |
            target/surefire-reports
            target/browser-server.log
            target/java-library-server.log
            target/browser-screenshots
