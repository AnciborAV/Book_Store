name: CSS and HTML visual equivalence
on:
  pull_request:
    paths:
      - 'src/main/resources/static/*.css'
      - 'src/main/resources/static/*.html'
      - 'scripts/style-visual-check.cjs'
      - '.github/workflows/style-visual.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated visual test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/style-visual" playwright@1.58.2
          "$RUNNER_TEMP/style-visual/node_modules/.bin/playwright" install --with-deps chromium
      - name: Compare static pages and CSSOM
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/style-visual/node_modules/playwright
          VISUAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/style-visual-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: css-html-visual-comparison
          path: target/style-visual
