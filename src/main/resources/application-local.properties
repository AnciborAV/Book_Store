# Persistent local database, no PostgreSQL installation required.
spring.datasource.url=jdbc:h2:file:./data/bookstore;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate

# Explicit schema prevents Liquibase metadata case mismatch on H2 restart.
spring.liquibase.default-schema=public
spring.liquibase.liquibase-schema=public
spring.liquibase.database-change-log-table=databasechangelog
spring.liquibase.database-change-log-lock-table=databasechangeloglock
