spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/books}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.liquibase.change-log=classpath:db/migration/db.changelog-master.xml
spring.liquibase.enabled=true

# Browser profile uploads and session cookies
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m
spring.mvc.problemdetails.enabled=true
