spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/BOOKS}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.liquibase.change-log=classpath:db/migration/db.changelog-master.xml
spring.liquibase.enabled=true

# Browser profile uploads and session cookies
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=504MB

# Local development endpoint. Override explicitly when deploying.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.mvc.problemdetails.enabled=true
server.error.include-message=never

bookstore.admin.email=${BOOKSTORE_ADMIN_EMAIL:}
bookstore.admin.password=${BOOKSTORE_ADMIN_PASSWORD:}

# Optional SMTP delivery. Credentials belong in environment variables only.
bookstore.mail.enabled=${BOOKSTORE_MAIL_ENABLED:false}
bookstore.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Spool uploads to temporary disk, never buffer a complete large PDF in heap.
spring.servlet.multipart.file-size-threshold=0
